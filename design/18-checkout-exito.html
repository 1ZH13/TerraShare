<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraShare — 18 Pago confirmado</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f6f5f0;--surface-1:#f0eee7;--surface-2:#ffffff;--border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.18);--text-primary:#20201e;--text-secondary:#5f5e59;--text-muted:#8b8a82;--radius:8px;--brand-900:#173404;--brand-800:#27500A;--brand-700:#3B6D11;--brand-600:#639922;--brand-400:#97C459;--brand-100:#C0DD97;--brand-50:#EAF3DE;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
@media (prefers-color-scheme:dark){:root{--surface-0:#1a1a18;--surface-1:#232320;--surface-2:#2b2b28;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.20);--text-primary:#f2f1ea;--text-secondary:#b8b7ae;--text-muted:#8b8a82;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans);line-height:1.6;}
.canvas{max-width:760px;margin:0 auto;padding:24px 16px;}
a{color:inherit;text-decoration:none;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
@keyframes pop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.rev{animation:fadeUp .6s cubic-bezier(.2,.7,.3,1) both;}
.ctaBtn{transition:transform .15s ease;}.ctaBtn:hover{transform:translateY(-1px);}
@media (prefers-reduced-motion:reduce){.rev{animation:none;}.pop{animation:none;}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.2) both;}
</style>
</head>
<body>
<h1 class="sr-only">Pago confirmado</h1>
<div class="canvas">
<div style="background: var(--surface-2); border: .5px solid var(--border); border-radius: 12px; padding: 44px 24px; text-align: center; max-width: 420px; margin: 0 auto;">
  <div class="pop" style="width: 72px; height: 72px; border-radius: 50%; background: var(--brand-50); color: var(--brand-700); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;"><i class="ti ti-check" style="font-size: 40px;" aria-hidden="true"></i></div>
  <div class="rev" style="font-size: 24px; font-weight: 500; letter-spacing: -.4px;">¡Pago confirmado!</div>
  <p class="rev" style="animation-delay: .08s; color: var(--text-secondary); margin: 8px 0 20px;">Tu alquiler de <b style="font-weight: 500; color: var(--text-primary);">Lote Vista Caisán</b> quedó activo. El propietario ya fue notificado.</p>

  <div class="rev" style="animation-delay: .12s; background: var(--surface-1); border-radius: 12px; padding: 14px; text-align: left; margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; padding: 4px 0;"><span style="color: var(--text-secondary); font-size: 14px;">Monto</span><span style="font-weight: 500;">$560.00</span></div>
    <div style="display: flex; justify-content: space-between; padding: 4px 0;"><span style="color: var(--text-secondary); font-size: 14px;">Periodo</span><span>Abr – Dic 2026</span></div>
    <div style="display: flex; justify-content: space-between; padding: 4px 0;"><span style="color: var(--text-secondary); font-size: 14px;">Referencia</span><span style="font-family: monospace; font-size: 13px;">pay_a1b2c3</span></div>
  </div>

  <div class="rev" style="animation-delay: .16s; display: flex; gap: 8px; justify-content: center;">
    <a href="07-trato.html" class="ctaBtn" style="background: var(--brand-800); color: #fff; border: .5px solid var(--brand-800); border-radius: var(--radius); padding: 10px 18px;">Ver mi trato</a>
    <a href="02-home-busco.html" class="ctaBtn" style="border: .5px solid var(--border-strong); border-radius: var(--radius); padding: 10px 18px;">Ir al inicio</a>
  </div>
  <div style="font-size: 11px; color: var(--text-muted); margin-top: 16px;"><i class="ti ti-lock" aria-hidden="true"></i> Procesado de forma segura con Stripe</div>
</div>
</div>
</body>
</html>
