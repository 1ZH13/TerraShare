<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraShare — 17 Pagos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f6f5f0;--surface-1:#f0eee7;--surface-2:#ffffff;--border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.18);--text-primary:#20201e;--text-secondary:#5f5e59;--text-muted:#8b8a82;--radius:8px;--brand-900:#173404;--brand-800:#27500A;--brand-700:#3B6D11;--brand-50:#EAF3DE;--amber-bg:#FAEEDA;--amber-fg:#854F0B;--green-bg:#EAF3DE;--green-fg:#27500A;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
@media (prefers-color-scheme:dark){:root{--surface-0:#1a1a18;--surface-1:#232320;--surface-2:#2b2b28;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.20);--text-primary:#f2f1ea;--text-secondary:#b8b7ae;--text-muted:#8b8a82;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans);line-height:1.6;}
.canvas{max-width:760px;margin:0 auto;padding:24px 16px;}
button{font-family:inherit;cursor:pointer;border:.5px solid var(--border-strong);background:transparent;color:var(--text-primary);border-radius:var(--radius);padding:8px 14px;font-size:14px;}
a{color:inherit;text-decoration:none;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.rev{animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) both;}
.seg{display:inline-flex;background:var(--surface-1);border-radius:20px;padding:3px;gap:2px;}
.seg button{border:0;background:transparent;border-radius:18px;padding:6px 16px;font-size:14px;color:var(--text-secondary);}
.seg button.active{background:var(--brand-800);color:#fff;}
.pill{font-size:11px;padding:3px 8px;border-radius:6px;}
th{text-align:left;font-size:12px;color:var(--text-muted);font-weight:400;padding:8px 10px;border-bottom:.5px solid var(--border);}
td{font-size:13px;padding:10px;border-bottom:.5px solid var(--border);}
@media (prefers-reduced-motion:reduce){.rev{animation:none;}}
</style>
</head>
<body>
<h1 class="sr-only">Historial de pagos</h1>
<div class="canvas">
<div style="background: var(--surface-2); border: .5px solid var(--border); border-radius: 12px; overflow: hidden;">

  <div class="rev" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: .5px solid var(--border);">
    <a href="02-home-busco.html" style="display: flex; align-items: center; gap: 8px;"><i class="ti ti-plant-2" style="font-size: 24px; color: var(--brand-700);" aria-hidden="true"></i><span style="font-size: 18px; font-weight: 500;">TerraShare</span></a>
    <div class="seg"><button class="active"><i class="ti ti-search" aria-hidden="true"></i> Busco</button><a href="03-home-ofrezco.html"><button><i class="ti ti-map-2" aria-hidden="true"></i> Ofrezco</button></a></div>
    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--brand-50); color: var(--brand-800); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500;">ZH</div>
  </div>

  <div class="rev" style="padding: 22px 22px 8px;">
    <div style="font-size: 22px; font-weight: 500; letter-spacing: -.4px;">Pagos</div>
    <p style="color: var(--text-secondary); margin: 4px 0 0;">Historial de tus pagos de alquiler.</p>
  </div>

  <div class="rev" style="animation-delay: .06s; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 22px;">
    <div style="background: var(--surface-1); border-radius: var(--radius); padding: 12px;"><div style="font-size: 20px; font-weight: 500;">$1,540</div><div style="font-size: 12px; color: var(--text-muted);">Pagado este año</div></div>
    <div style="background: var(--surface-1); border-radius: var(--radius); padding: 12px;"><div style="font-size: 20px; font-weight: 500; color: var(--amber-fg);">$560</div><div style="font-size: 12px; color: var(--text-muted);">Pendiente</div></div>
    <div style="background: var(--surface-1); border-radius: var(--radius); padding: 12px;"><div style="font-size: 20px; font-weight: 500;">3</div><div style="font-size: 12px; color: var(--text-muted);">Transacciones</div></div>
  </div>

  <div class="rev" style="animation-delay: .1s; margin: 4px 22px 22px; border: .5px solid var(--border); border-radius: 12px; overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse;">
      <thead><tr><th>Fecha</th><th>Terreno</th><th>Monto</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        <tr><td style="color: var(--text-secondary);">12 abr 2026</td><td style="font-weight: 500;">Parcela Río Indio</td><td>$390</td><td><span class="pill" style="background: var(--green-bg); color: var(--green-fg);">Pagado</span></td><td style="text-align: right;"><a href="#" style="color: var(--brand-700); font-size: 13px;">Recibo</a></td></tr>
        <tr><td style="color: var(--text-secondary);">03 abr 2026</td><td style="font-weight: 500;">Finca El Tamarindo</td><td>$420</td><td><span class="pill" style="background: var(--green-bg); color: var(--green-fg);">Pagado</span></td><td style="text-align: right;"><a href="#" style="color: var(--brand-700); font-size: 13px;">Recibo</a></td></tr>
        <tr><td style="color: var(--text-secondary);">Pendiente</td><td style="font-weight: 500;">Lote Vista Caisán</td><td>$560</td><td><span class="pill" style="background: var(--amber-bg); color: var(--amber-fg);">Pendiente</span></td><td style="text-align: right;"><a href="07-trato.html" style="color: var(--brand-700); font-size: 13px;">Pagar</a></td></tr>
      </tbody>
    </table>
  </div>

</div>
</div>
</body>
</html>
