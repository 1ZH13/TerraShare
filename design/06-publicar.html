<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraShare — 06 Publicar terreno</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f6f5f0;--surface-1:#f0eee7;--surface-2:#ffffff;--border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.18);--text-primary:#20201e;--text-secondary:#5f5e59;--text-muted:#8b8a82;--radius:8px;--brand-900:#173404;--brand-800:#27500A;--brand-700:#3B6D11;--brand-600:#639922;--brand-400:#97C459;--brand-100:#C0DD97;--brand-50:#EAF3DE;--amber-bg:#FAEEDA;--amber-fg:#854F0B;--green-bg:#EAF3DE;--green-fg:#27500A;--blue-bg:#E6F1FB;--blue-fg:#0C447C;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
@media (prefers-color-scheme:dark){:root{--surface-0:#1a1a18;--surface-1:#232320;--surface-2:#2b2b28;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.20);--text-primary:#f2f1ea;--text-secondary:#b8b7ae;--text-muted:#8b8a82;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
.canvas{max-width:760px;margin:0 auto;padding:24px 16px;}
h1,h2,h3{font-weight:500;color:var(--text-primary);margin:0;}
button{font-family:inherit;cursor:pointer;border:.5px solid var(--border-strong);background:transparent;color:var(--text-primary);border-radius:var(--radius);padding:8px 14px;font-size:14px;transition:transform .15s ease,background .15s ease;}
button:hover{background:var(--surface-1);}
button:active{transform:scale(.98);}
a{color:inherit;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.rev{animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) both;}
.tsc{transition:transform .2s ease,border-color .2s ease;}
.tsc:hover{transform:translateY(-3px);border-color:var(--brand-400);}
.floaty{animation:floaty 4.5s ease-in-out infinite;}
.ctaBtn{transition:transform .15s ease;}
.ctaBtn:hover{transform:translateY(-1px);}
@media (prefers-reduced-motion:reduce){.rev,.floaty{animation:none;}}
.seg{display:inline-flex;background:var(--surface-1);border-radius:20px;padding:3px;gap:2px;}
.seg button{border:0;background:transparent;border-radius:18px;padding:6px 16px;font-size:14px;color:var(--text-secondary);}
.seg button.active{background:var(--brand-800);color:#fff;}
.seg button:hover:not(.active){background:transparent;color:var(--text-primary);}
</style>
</head>
<body>
<h1 class="sr-only">Wizard de publicación de terreno, paso 1</h1>
<div class="canvas">
<div style="background: var(--surface-2); border: .5px solid var(--border); border-radius: 12px; overflow: hidden;">

  <div class="rev" style="display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: .5px solid var(--border);">
    <a href="03-home-ofrezco.html" style="color: var(--text-secondary); font-size: 14px;"><i class="ti ti-x" aria-hidden="true"></i> Cancelar</a>
    <span style="margin-left: auto; font-size: 14px; font-weight: 500;">Publicar terreno</span>
    <span style="margin-left: auto; font-size: 13px; color: var(--text-muted);">Paso 1 de 4</span>
  </div>

  <div class="rev" style="display: flex; gap: 8px; padding: 18px 22px 6px;">
    <div style="flex: 1; text-align: center;"><div style="height: 4px; border-radius: 4px; background: var(--brand-700);"></div><div style="font-size: 12px; color: var(--brand-800); margin-top: 6px; font-weight: 500;">Datos</div></div>
    <div style="flex: 1; text-align: center;"><div style="height: 4px; border-radius: 4px; background: var(--border);"></div><div style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">Ubicación</div></div>
    <div style="flex: 1; text-align: center;"><div style="height: 4px; border-radius: 4px; background: var(--border);"></div><div style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">Precio</div></div>
    <div style="flex: 1; text-align: center;"><div style="height: 4px; border-radius: 4px; background: var(--border);"></div><div style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">Fotos</div></div>
  </div>

  <div class="rev" style="animation-delay: .06s; padding: 18px 22px 8px; max-width: 560px;">
    <label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px;">Título de la publicación</label>
    <div style="background: var(--surface-1); border: .5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; color: var(--text-muted);">Ej. Finca El Tamarindo</div>

    <label style="font-size: 13px; color: var(--text-secondary); display: block; margin: 14px 0 6px;">Descripción</label>
    <div style="background: var(--surface-1); border: .5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; color: var(--text-muted); min-height: 68px;">Describe el terreno, agua, acceso, suelo…</div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px;">
      <div><label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px;">Área (hectáreas)</label><div style="background: var(--surface-1); border: .5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; color: var(--text-muted);">0.0</div></div>
      <div><label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px;">Tipo de operación</label>
        <div class="seg" style="width: 100%;"><button class="active" style="flex: 1;">Alquiler</button><button style="flex: 1;">Venta</button><button style="flex: 1;">Ambas</button></div>
      </div>
    </div>

    <label style="font-size: 13px; color: var(--text-secondary); display: block; margin: 14px 0 8px;">Usos permitidos</label>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <span style="font-size: 13px; color: var(--brand-800); background: var(--brand-50); border: .5px solid var(--brand-400); border-radius: 20px; padding: 6px 14px;"><i class="ti ti-check" aria-hidden="true"></i> Agricultura</span>
      <span style="font-size: 13px; color: var(--text-secondary); background: var(--surface-1); border-radius: 20px; padding: 6px 14px;">Ganadería</span>
      <span style="font-size: 13px; color: var(--text-secondary); background: var(--surface-1); border-radius: 20px; padding: 6px 14px;">Forestal</span>
      <span style="font-size: 13px; color: var(--text-secondary); background: var(--surface-1); border-radius: 20px; padding: 6px 14px;">Acuicultura</span>
      <span style="font-size: 13px; color: var(--text-secondary); background: var(--surface-1); border-radius: 20px; padding: 6px 14px;">Mixto</span>
    </div>
  </div>

  <div class="rev" style="animation-delay: .12s; display: flex; justify-content: space-between; padding: 18px 22px 22px; border-top: .5px solid var(--border); margin-top: 12px;">
    <button class="ctaBtn" style="color: var(--text-muted); border: 0;">Atrás</button>
    <a href="20-publicar-ubicacion.html"><button class="ctaBtn" style="background: var(--brand-800); color: #fff; border-color: var(--brand-800); padding: 10px 20px;">Continuar <i class="ti ti-arrow-right" aria-hidden="true"></i></button></a>
  </div>

</div>
</div>
</body>
</html>
