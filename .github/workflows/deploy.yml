name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GITHUB_TOKEN,MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,CLERK_JWKS_URL,CLERK_ISSUER,CLERK_SECRET_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,VITE_CLERK_PUBLISHABLE_KEY
          script: |
            BRANCH="${{ github.ref_name }}"
            # Fallback to main if run from workflow_dispatch on a different ref without properly picking
            if [ -z "$BRANCH" ]; then
              BRANCH="main"
            fi

            # Environment specific variables
            if [ "$BRANCH" = "main" ]; then
              TARGET_DIR="/opt/terrashare-prod"
              PROJECT_NAME="terrashare-prod"
              WEB_PORT="80"
              API_PORT="3000"
              CORS_ALLOWED_ORIGINS="https://terrashare.duckdns.org,https://success.terrashare.duckdns.org"
              VITE_API_BASE_URL="https://terrashare.duckdns.org"
            else
              TARGET_DIR="/opt/terrashare-staging"
              PROJECT_NAME="terrashare-staging"
              WEB_PORT="8080"
              API_PORT="3001"
              CORS_ALLOWED_ORIGINS="https://terrashare-test.duckdns.org,https://success.terrashare-test.duckdns.org"
              VITE_API_BASE_URL="https://terrashare-test.duckdns.org"
            fi

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git .
            fi

            git fetch origin
            git fetch origin --tags

            PRE_DEPLOY_TAG="deploy-pre-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short origin/$BRANCH)"
            git tag "$PRE_DEPLOY_TAG" "origin/$BRANCH"

            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            printf '%s\n' \
              "MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}" \
              "MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}" \
              "CLERK_JWKS_URL=${CLERK_JWKS_URL}" \
              "CLERK_ISSUER=${CLERK_ISSUER}" \
              "CLERK_SECRET_KEY=${CLERK_SECRET_KEY}" \
              "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" \
              "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}" \
              "VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}" \
              "VITE_API_BASE_URL=${VITE_API_BASE_URL}" \
              "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}" \
              "WEB_PORT=${WEB_PORT}" \
              "API_PORT=${API_PORT}" \
              "COMPOSE_PROJECT_NAME=${PROJECT_NAME}" \
              > .env
            chmod 600 .env

            # Red compartida para el enrutado del proxy
            docker network create terrashare-network 2>/dev/null || true

            # Asegura el proxy (solo prod define el servicio; se levanta desde el dir de prod).
            #
            # `up -d` siempre, sin el guarda de «solo si no está corriendo» que
            # había antes: es idempotente —si nada cambió deja el contenedor
            # intacto— y, si cambió su definición (imagen, puertos, montajes),
            # lo recrea. Con el guarda, un cambio de montaje no se aplicaba
            # nunca porque el proxy siempre estaba en pie (#404).
            ( cd /opt/terrashare-prod && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d proxy certbot 2>/dev/null || true )

            # Recarga la configuración del proxy.
            #
            # nginx lee su configuración al arrancar, así que un cambio que solo
            # toca el CONTENIDO de nginx/conf.d/ no se aplica si el contenedor ya
            # estaba en pie: `up -d` no lo recrea porque su definición no cambió.
            # Sin esta recarga, ningún cambio del proxy llegaba a producción
            # (#402), y el límite de subida de fotos (#389) se quedó sin efecto
            # pese a desplegarse en verde.
            #
            # Solo en main: el fichero montado sale de /opt/terrashare-prod.
            if [ "$BRANCH" = "main" ] && docker ps --format '{{.Names}}' | grep -q terrashare-proxy; then
              # `nginx -t` primero: si la configuración es inválida no se recarga
              # y sigue sirviendo la anterior. Recargar a ciegas tumbaría el sitio.
              if docker exec terrashare-proxy nginx -t; then
                docker exec terrashare-proxy nginx -s reload
                echo "Proxy: configuración validada y recargada."
              else
                echo "::error::La configuración de nginx no es válida. No se recarga (sigue la anterior) y se aborta el despliegue."
                exit 1
              fi
            fi

            # Respaldo de la BD antes de tocar los contenedores (#453). Vuelca la
            # Mongo en marcha (la del deploy anterior) a un archivo comprimido en el
            # host y conserva los últimos 7. Si Mongo aún no está en pie (primer
            # deploy) o el volcado falla, se avisa y se continúa: el respaldo es una
            # red de seguridad, no debe bloquear el despliegue.
            DB_BACKUP_DIR="$TARGET_DIR/db-backups"
            mkdir -p "$DB_BACKUP_DIR"
            MONGO_CID=$(docker ps --filter "name=${PROJECT_NAME}-mongo" --format '{{.ID}}' | head -1)
            if [ -n "$MONGO_CID" ]; then
              BK_FILE="$DB_BACKUP_DIR/terrashare-$(date +%Y%m%d-%H%M%S).archive.gz"
              if docker exec "$MONGO_CID" mongodump --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --db terrashare --archive --gzip > "$BK_FILE" 2>/dev/null && [ -s "$BK_FILE" ]; then
                echo "Respaldo de BD OK: $BK_FILE ($(du -h "$BK_FILE" | cut -f1))"
                ls -1t "$DB_BACKUP_DIR"/terrashare-*.archive.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
              else
                echo "WARN: no se pudo respaldar la BD (¿Mongo sin datos o sin arrancar?); se continúa."
                rm -f "$BK_FILE"
              fi
            else
              echo "Respaldo de BD omitido: no hay contenedor Mongo en marcha (primer deploy)."
            fi

            # App: prod usa prod.yml (con proxy/certbot); staging usa staging.yml (sin proxy
            # propio, va tras el proxy compartido). El resultado define si el deploy fue OK.
            if [ "$BRANCH" = "main" ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --remove-orphans
            else
              docker compose -f docker-compose.yml -f docker-compose.staging.yml up --build -d --remove-orphans
            fi
            DEPLOY_EXIT=$?

            # Verificación post-deploy: el dominio debe responder por HTTPS.
            PRIMARY_DOMAIN=$(echo "$CORS_ALLOWED_ORIGINS" | cut -d',' -f1 | sed 's#https://##')
            sleep 3
            HTTPS_CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://${PRIMARY_DOMAIN}/" || true)
            echo "Verificación HTTPS de ${PRIMARY_DOMAIN}: HTTP ${HTTPS_CODE:-000}"

            # AUTO-ROLLBACK (red de seguridad): si el HTTPS no responde 200, restaura el
            # serving DIRECTO por IP para que el entorno NO quede caído. No requiere SSH.
            if [ "$HTTPS_CODE" != "200" ]; then
              echo "WARN: HTTPS=${HTTPS_CODE:-000}. Auto-rollback -> serving directo por IP en :${WEB_PORT}."
              # En prod se retira el proxy (vuelve a directo). En staging NO se toca el
              # proxy porque lo comparte prod.
              if [ "$BRANCH" = "main" ]; then
                docker rm -f terrashare-proxy terrashare-certbot 2>/dev/null || true
              fi
              # El frontend se compila con la URL de la API: al volver a directo, apunta a la IP.
              sed -i "s#^VITE_API_BASE_URL=.*#VITE_API_BASE_URL=http://159.223.188.105:${API_PORT}#" .env
              docker compose -f docker-compose.yml up -d --build --remove-orphans
              DEPLOY_EXIT=1
              echo "Auto-rollback completado: app servida en http://159.223.188.105:${WEB_PORT} (revisar SSL)."
            fi

            if [ $DEPLOY_EXIT -eq 0 ]; then
              GOOD_TAG="deploy-good-$(date +%Y%m%d-%H%M%S)"
              git tag "$GOOD_TAG" "$BRANCH"
              echo "$GOOD_TAG" > .last-good-deploy
              echo "Deploy OK. Rollback: ./scripts/rollback.sh $TARGET_DIR $BRANCH"
            else
              echo "Deploy FAILED (exit $DEPLOY_EXIT). Rollback: ./scripts/rollback.sh $TARGET_DIR $BRANCH"
            fi
            exit $DEPLOY_EXIT