name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GITHUB_TOKEN,MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,CLERK_JWKS_URL,CLERK_ISSUER,CLERK_SECRET_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,VITE_CLERK_PUBLISHABLE_KEY
          script: |
            BRANCH="${{ github.ref_name }}"
            # Fallback to main if run from workflow_dispatch on a different ref without properly picking
            if [ -z "$BRANCH" ]; then
              BRANCH="main"
            fi

            # Environment specific variables
            if [ "$BRANCH" = "main" ]; then
              TARGET_DIR="/opt/terrashare-prod"
              PROJECT_NAME="terrashare-prod"
              WEB_PORT="80"
              API_PORT="3000"
              CORS_ALLOWED_ORIGINS="https://terrashare.duckdns.org,https://success.terrashare.duckdns.org"
              VITE_API_BASE_URL="https://terrashare.duckdns.org"
            else
              TARGET_DIR="/opt/terrashare-staging"
              PROJECT_NAME="terrashare-staging"
              WEB_PORT="8080"
              API_PORT="3001"
              CORS_ALLOWED_ORIGINS="https://terrashare-test.duckdns.org,https://success.terrashare-test.duckdns.org"
              VITE_API_BASE_URL="https://terrashare-test.duckdns.org"
            fi

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git .
            fi

            git fetch origin
            git fetch origin --tags

            PRE_DEPLOY_TAG="deploy-pre-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short origin/$BRANCH)"
            git tag "$PRE_DEPLOY_TAG" "origin/$BRANCH"

            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            printf '%s\n' \
              "MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}" \
              "MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}" \
              "CLERK_JWKS_URL=${CLERK_JWKS_URL}" \
              "CLERK_ISSUER=${CLERK_ISSUER}" \
              "CLERK_SECRET_KEY=${CLERK_SECRET_KEY}" \
              "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" \
              "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}" \
              "VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}" \
              "VITE_API_BASE_URL=${VITE_API_BASE_URL}" \
              "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}" \
              "WEB_PORT=${WEB_PORT}" \
              "API_PORT=${API_PORT}" \
              "COMPOSE_PROJECT_NAME=${PROJECT_NAME}" \
              > .env
            chmod 600 .env

            # Red compartida para el enrutado del proxy
            docker network create terrashare-network 2>/dev/null || true

            # 1) App containers (web/backend/mongo): sin puertos expuestos, van tras el proxy.
            #    El resultado de ESTE paso define si el deploy fue OK (el SSL es best-effort).
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --remove-orphans web backend-api mongo
            DEPLOY_EXIT=$?

            # 2) Bootstrap SSL + proxy (idempotente y NO fatal): crea un cert temporal
            #    para que nginx arranque, levanta el proxy, emite el cert real de
            #    Let's Encrypt por webroot y recarga. Ver scripts/init-letsencrypt.sh.
            chmod +x scripts/init-letsencrypt.sh
            CERTBOT_EMAIL="${CERTBOT_EMAIL:-admin@terrashare.duckdns.org}" \
              bash scripts/init-letsencrypt.sh || echo "WARN: init-letsencrypt no completó; el proxy sigue con cert temporal. Revisar SSL."

            # 3) certbot en background (renovación automática cada 12h)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d certbot

            # 4) Verificación post-deploy: el dominio debe responder por HTTPS.
            PRIMARY_DOMAIN=$(echo "$CORS_ALLOWED_ORIGINS" | cut -d',' -f1 | sed 's#https://##')
            sleep 3
            HTTPS_CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://${PRIMARY_DOMAIN}/" || echo "000")
            echo "Verificación HTTPS de ${PRIMARY_DOMAIN}: HTTP ${HTTPS_CODE}"
            [ "$HTTPS_CODE" = "200" ] || echo "WARN: HTTPS no devolvió 200 (revisar certs/proxy)."

            if [ $DEPLOY_EXIT -eq 0 ]; then
              GOOD_TAG="deploy-good-$(date +%Y%m%d-%H%M%S)"
              git tag "$GOOD_TAG" "$BRANCH"
              echo "$GOOD_TAG" > .last-good-deploy
              echo "Deploy OK. Rollback: ./scripts/rollback.sh $TARGET_DIR $BRANCH"
            else
              echo "Deploy FAILED (exit $DEPLOY_EXIT). Rollback: ./scripts/rollback.sh $TARGET_DIR $BRANCH"
            fi
            exit $DEPLOY_EXIT