name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GITHUB_TOKEN,MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,CLERK_JWKS_URL,CLERK_ISSUER,CLERK_SECRET_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,VITE_CLERK_PUBLISHABLE_KEY,VITE_API_BASE_URL
          script: |
            BRANCH="${{ github.ref_name }}"
            # Fallback to main if run from workflow_dispatch on a different ref without properly picking
            if [ -z "$BRANCH" ]; then
              BRANCH="main"
            fi

            # Environment specific variables
            if [ "$BRANCH" = "main" ]; then
              TARGET_DIR="/opt/terrashare-prod"
              PROJECT_NAME="terrashare-prod"
              WEB_PORT="80"
              API_PORT="3000"
            else
              TARGET_DIR="/opt/terrashare-staging"
              PROJECT_NAME="terrashare-staging"
              WEB_PORT="8080"
              API_PORT="3001"
            fi

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git .
            fi

            git fetch origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            printf '%s\n' \
              "MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}" \
              "MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}" \
              "CLERK_JWKS_URL=${CLERK_JWKS_URL}" \
              "CLERK_ISSUER=${CLERK_ISSUER}" \
              "CLERK_SECRET_KEY=${CLERK_SECRET_KEY}" \
              "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" \
              "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}" \
              "VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}" \
              "VITE_API_BASE_URL=${VITE_API_BASE_URL}" \
              "WEB_PORT=${WEB_PORT}" \
              "API_PORT=${API_PORT}" \
              "COMPOSE_PROJECT_NAME=${PROJECT_NAME}" \
              > .env
            chmod 600 .env

            docker compose up --build -d --remove-orphans