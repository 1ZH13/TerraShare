name: Deploy to Railway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      service:
        description: "Service to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - backend
          - web
          - mcp
          - all

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy Backend API
        if: github.event.inputs.service == 'backend' || github.event.inputs.service == 'all'
        run: |
          cd apps/backend-api
          railway up --service ${{ github.event.inputs.environment }}-backend
      
      - name: Deploy Web Frontend
        if: github.event.inputs.service == 'web' || github.event.inputs.service == 'all'
        run: |
          cd apps/web
          railway up --service ${{ github.event.inputs.environment }}-web
      
      - name: Deploy MCP Server
        if: github.event.inputs.service == 'mcp' || github.event.inputs.service == 'all'
        run: |
          cd apps/mcp-server
          railway up --service ${{ github.event.inputs.environment }}-mcp
      
      - name: Verify Deployment
        run: |
          echo "Deployment to ${{ github.event.inputs.environment }} completed"
          echo "Service: ${{ github.event.inputs.service }}"
