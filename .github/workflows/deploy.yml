name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

jobs:
  deploy-staging:
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install backend dependencies
        run: cd apps/backend-api && bun install --frozen-lockfile
      - name: Install web dependencies
        run: cd apps/web && bun install --frozen-lockfile
      - name: Build backend
        run: cd apps/backend-api && bun run build
      - name: Build web
        run: cd apps/web && bun run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
        # Agregar comando real de despliegue (Vercel, Railway, etc.)

  deploy-production:
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install backend dependencies
        run: cd apps/backend-api && bun install --frozen-lockfile
      - name: Install web dependencies
        run: cd apps/web && bun install --frozen-lockfile
      - name: Build backend
        run: cd apps/backend-api && bun run build
      - name: Build web
        run: cd apps/web && bun run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - name: Deploy to production
        run: echo "Deploying to production environment..."
        # Agregar comando real de despliegue