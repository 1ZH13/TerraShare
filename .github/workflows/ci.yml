name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install shared package deps (zod, resuelto desde fuente)
        run: cd ../../packages/shared && bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install shared package deps (zod, resuelto desde fuente)
        run: cd ../../packages/shared && bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun test

  mcp-server:
    name: MCP Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install shared package deps (zod, resuelto desde fuente)
        run: cd ../../packages/shared && bun install --frozen-lockfile
      - name: Install backend-api deps (reutilizadas vía @backend/*)
        run: cd ../backend-api && bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install shared package deps (zod, resuelto desde fuente)
        run: cd ../../packages/shared && bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-typecheck, backend-tests, web-build]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install shared package deps (zod, resuelto desde fuente)
        run: cd ../../packages/shared && bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      # `dev-ssr` corre las pruebas de interactividad contra `vite dev`, donde la
      # app se renderiza en el servidor. Es el modo que nadie probaba y por donde
      # se colaron #354 (la app no hidrataba) y el crash de Leaflet (#358).
      - run: bun run test:e2e -- --project=chromium --project=dev-ssr
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Habilita las pruebas con sesión: con esta clave se pide el testing
          # token de Clerk y `clerk.signIn` entra sin pasar por el formulario.
          # Mientras el secreto no exista llega vacía y esas pruebas se saltan
          # solas, así que el pipeline sigue verde igual.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_TEST_EMAIL: ${{ secrets.E2E_CLERK_TEST_EMAIL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/playwright-report/trace.zip
          if-no-files-found: ignore

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-typecheck, web-build]
    steps:
      - uses: actions/checkout@v4
      # Sin setup-buildx-action a propósito: el builder por defecto de dockerd
      # permite `network: host` en el build (que el web necesita para el
      # prerender del shell SPA); el driver docker-container exigiría entitlement.
      - name: Build images via compose
        run: docker compose build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          MONGO_ROOT_USERNAME: ci
          MONGO_ROOT_PASSWORD: ci