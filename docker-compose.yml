version: '3.8'

services:
  backend-api:
    build:
      context: .
      dockerfile: apps/backend-api/Dockerfile
    image: terrashare-backend-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # MONGODB_URI se construye desde las credenciales del contenedor mongo
      # usando el hostname interno de Docker ('mongo' = nombre del servicio)
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/terrashare?authSource=admin
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - REQUIRE_ADMIN_MFA=${REQUIRE_ADMIN_MFA}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL}
      # C4: Variables obligatorias en env.ts que faltaban
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_ISSUER=${CLERK_ISSUER}
    depends_on:
      mongo:
        # m4: Esperar a que Mongo este healthy antes de arrancar el backend
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    image: terrashare-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-api

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      # M2: Sin fallbacks hardcodeados — las credenciales deben estar en .env
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    # M1: Puerto 27017 NO expuesto al exterior — solo accesible internamente
    volumes:
      - mongo_data:/data/db
    # m4: Healthcheck para que backend-api espere a que Mongo este listo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
