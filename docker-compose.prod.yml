services:
  backend-api:
    ports: !reset []
    networks:
      - terrashare-network

  web:
    ports: !reset []
    networks:
      - terrashare-network

  mongo:
    networks:
      - terrashare-network

  proxy:
    image: nginx:alpine
    container_name: terrashare-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # La CARPETA, no el fichero suelto. Docker, al montar un fichero
      # individual, ata su inodo; el despliegue hace `git reset --hard`, que lo
      # reemplaza (inodo nuevo), y el contenedor seguía viendo el contenido
      # antiguo para siempre — ni recargar nginx servía de nada (#404).
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - web
      - backend-api
    networks:
      - terrashare-network

  certbot:
    image: certbot/certbot
    container_name: terrashare-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - terrashare-network

volumes:
  certbot-etc:
  certbot-var:
  certbot-www:

networks:
  terrashare-network:
    external: true
