upstream prod_web {
    server terrashare-prod-web-1:80;
}

upstream prod_api {
    server terrashare-prod-backend-api-1:3000;
}

upstream staging_web {
    server terrashare-staging-web-1:80;
}

upstream staging_api {
    server terrashare-staging-backend-api-1:3000;
}

# ─── HTTP: redirect to HTTPS ────────────────────────────────────────────
server {
    listen 80;
    server_name terrashare.duckdns.org success.terrashare.duckdns.org
                 terrashare-test.duckdns.org success.terrashare-test.duckdns.org;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: Production ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name terrashare.duckdns.org success.terrashare.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/terrashare.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terrashare.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://prod_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://prod_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── HTTPS: Staging ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name terrashare-test.duckdns.org success.terrashare-test.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/terrashare-test.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terrashare-test.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://staging_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://staging_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
